name: Run tests

on:
  workflow_call:
    inputs:
      python-versions:
        description: >-
          JSON list of the Python versions to test. Defaults to every supported version, 3.10 to 3.15; a repository
          that does not pass on all of them yet can narrow it, for example '["3.10", "3.11"]'.
        required: false
        default: '["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]'
        type: string

defaults:
  run:
    shell: bash

env:
  LANG: en_US.utf-8
  LC_ALL: en_US.utf-8

jobs:
  run-tests:
    strategy:
      # Report every Python version's result instead of cancelling the others when one fails.
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04"]
        python: ${{ fromJSON(inputs.python-versions) }}

    runs-on: ${{ matrix.os }}

    steps:
      - run: echo "🔎 The job was triggered from repository ${{ github.repository }} and branch ${{ github.ref }}"
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"

      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Checkout develop branch for periodic testing
        if: ${{ github.event_name == 'schedule' }}
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Checkout code
        if: ${{ github.event_name != 'schedule' }}
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      #----------------------------------------------
      #  -----  install & configure poetry  -----
      #----------------------------------------------
      - name: Install Poetry
        uses: snok/install-poetry@v1.3.4
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true


      #----------------------------------------------
      # install dependencies if cache does not exist
      #----------------------------------------------
      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      #----------------------------------------------
      # install your root project, and run tests.
      #----------------------------------------------
      - name: Install library and run tests
        run: |
          poetry install --no-interaction --with dev
          poetry run pytest
